name: Kernel Image
on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'Root Manager Variant'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - next
          - sukisu
          - kowsu
      ksu_ref:
        description: 'Optional commit/tag/branch. Empty = tested default for the chosen variant'
        required: false
        default: ''
        type: string
      susfs_ref:
        description: 'Optional SUSFS commit/tag/branch. Empty = main'
        required: false
        default: ''
        type: string
      enable_susfs:
        description: 'Include SUSFS (not available for kowsu)'
        required: true
        default: true
        type: boolean
      enable_nomount:
        description: 'Include NoMount'
        required: true
        default: true
        type: boolean
env:
  CLANG_DIR: clang-r596125
  KSU_VARIANT: ${{ github.event.inputs.ksu_variant || 'official' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref }}
  SUSFS_REF: ${{ github.event.inputs.susfs_ref }}
  USE_SUSFS: ${{ github.event.inputs.enable_susfs || 'true' }}
  USE_NOMOUNT: ${{ github.event.inputs.enable_nomount || 'true' }}
  KSU_MODE: builtin
  NOMOUNT_REF: v2.2.0
jobs:
  build-kernel-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
      - name: Increase file limit
        run: |
          sudo sysctl -w vm.swappiness=100
      - name: Check repository
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc device-tree-compiler bison flex libssl-dev build-essential libelf-dev u-boot-tools
          sudo curl --create-dirs -o /usr/local/bin/repo -L https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
      - name: Clone repo and sync
        run: |
          repo init -u https://github.com/tekocheng/aospa-calcite-kernel -b main -m manifest.xml --depth=1
          repo sync
          cp -rvf android_kernel_xiaomi_sm8450/. kernel_platform/xiaomi/sm8450/
          sed -i 's/\r$//' kernel_platform/xiaomi/sm8450/scripts/setlocalversion
          mkdir -p device/xiaomi/marble-kernel/dtbs
          echo "SRC_ROOT=$(pwd)" > kernel_platform/xiaomi/sm8450/.build.rc
      - name: Cache Clang
        uses: actions/cache@v6.1.0
        with:
          path: kernel_platform/clang
          key: clang-r596125
      - name: Setup Clang
        run: |
          mkdir -p kernel_platform/clang
          cd kernel_platform/clang
          if [ ! -d "${CLANG_DIR}" ]; then
            echo "Clang not found in cache. Downloading..."
            git clone -n --depth=1 --filter=tree:0 -b main-kernel --single-branch \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 .
            git sparse-checkout init --cone
            git sparse-checkout set ${CLANG_DIR}
            git checkout
          else
            echo "Using cached ${CLANG_DIR}"
          fi
      - name: Include KernelSU (${{ env.KSU_VARIANT }})
        run: |
          set -o pipefail
          cd kernel_platform/xiaomi/sm8450
          rm -rf KernelSU KernelSU-Next
          if [ "$USE_SUSFS" = "true" ]; then
            case "$KSU_VARIANT" in
              official) BASE="tiann/KernelSU/main";               DEF_REF="28db74f" ;;
              next)     BASE="pershoot/KernelSU-Next/dev-susfs";  DEF_REF="dev-susfs" ;;
              sukisu)   BASE="SukiSU-Ultra/SukiSU-Ultra/builtin"; DEF_REF="builtin" ;;
              kowsu)
                echo "ERROR: kowsu has no SUSFS support. Turn off enable_susfs or choose official, next or sukisu." >&2
                exit 1 ;;
              *) echo "ERROR: unknown variant '$KSU_VARIANT'" >&2; exit 1 ;;
            esac
          else
            case "$KSU_VARIANT" in
              official) BASE="tiann/KernelSU/main";                DEF_REF="28db74f" ;;
              next)     BASE="KernelSU-Next/KernelSU-Next/dev";    DEF_REF="dev" ;;
              sukisu)   BASE="SukiSU-Ultra/SukiSU-Ultra/main";     DEF_REF="main" ;;
              kowsu)    BASE="KOWX712/KernelSU/main";              DEF_REF="master" ;;
              *) echo "ERROR: unknown variant '$KSU_VARIANT'" >&2; exit 1 ;;
            esac
          fi
          REF="${KSU_REF:-$DEF_REF}"
          echo "Setting up $KSU_VARIANT (Ref: $REF)..."
          curl -fLSs "https://raw.githubusercontent.com/${BASE}/kernel/setup.sh" | bash -s "$REF"
      - name: Include NoMount
        if: env.USE_NOMOUNT == 'true'
        run: |
          cd kernel_platform/xiaomi/sm8450
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh" | bash -s "${NOMOUNT_REF}"
      - name: Clone SUSFS
        if: env.USE_SUSFS == 'true'
        run: |
          set -e
          ROOT="$(pwd)"
          cd "$ROOT"
          REF="${SUSFS_REF:-main}"
          echo "Cloning susfs4ksu (Ref: $REF)..."
          git clone -n --depth=1 --filter=tree:0 https://github.com/simonpunk/susfs4ksu.git
          cd susfs4ksu
          git fetch --depth=1 origin "$REF"
          git checkout FETCH_HEAD
      - name: Include SUSFS
        if: env.USE_SUSFS == 'true'
        run: |
          set -e
          ROOT="$(pwd)"
          KDIR="$ROOT/kernel_platform/xiaomi/sm8450"
          SUSFS="$ROOT/susfs4ksu/kernel_patches"

          cp "$SUSFS"/fs/* "$KDIR/fs/"
          cp "$SUSFS"/include/linux/* "$KDIR/include/linux/"
          cd "$KDIR"
          cp "$SUSFS/50_add_susfs_in_gki-android12-5.10.patch" .
          if ! patch -p1 --dry-run < 50_add_susfs_in_gki-android12-5.10.patch > /dev/null 2>&1; then
            echo "ERROR: Kernel SUSFS patch is incompatible with this kernel source!"
            exit 1
          fi
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

          case "$KSU_VARIANT" in
            official)
              cp "$SUSFS/KernelSU/10_enable_susfs_for_ksu.patch" KernelSU/
              cd KernelSU
              patch -p1 < 10_enable_susfs_for_ksu.patch
              ;;
            sukisu)
              python3 - <<'PY'
          p = "KernelSU/kernel/Kconfig"
          s = open(p).read()
          if "config KSU_SUSFS_PRIORITY_UID_FILTER" not in s:
              stanza = ("config KSU_SUSFS_PRIORITY_UID_FILTER\n"
                        "\tbool \"Hide user-defined uids from getpriority/setpriority/ioprio syscalls\"\n"
                        "\tdepends on KSU_SUSFS\n"
                        "\tdefault y\n\n")
              i = s.rindex("endmenu")
              open(p, "w").write(s[:i] + stanza + s[i:])
          PY
              ;;
            next)
              :
              ;;
          esac

          cd "$KDIR"
          if ! grep -q '^config KSU_SUSFS$' "$(readlink -f drivers/kernelsu)/Kconfig"; then
            echo "ERROR: $KSU_VARIANT has no CONFIG_KSU_SUSFS in its Kconfig; SUSFS is not integrated." >&2
            exit 1
          fi
      - name: Build kernel image
        env:
          KSU_MODE: ${{ env.KSU_MODE }}
          KSU_VARIANT: ${{ env.KSU_VARIANT }}
          SUSFS_ENABLE: ${{ env.USE_SUSFS == 'true' && '1' || '0' }}
          NOMOUNT_BUILTIN: ${{ env.USE_NOMOUNT == 'true' && '1' || '0' }}
        run: |
          cd kernel_platform/xiaomi/sm8450
          export PATH="$(realpath ../../clang/${CLANG_DIR}/bin):$PATH"
          ./build.sh marble --only-kernel
      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kernel-image-${{ env.KSU_VARIANT }}${{ env.USE_SUSFS == 'true' && '-susfs' || '' }}${{ env.USE_NOMOUNT == 'true' && '-nomount' || '' }}
          path: device/xiaomi/marble-kernel/Image
          compression-level: 9
