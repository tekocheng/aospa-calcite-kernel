name: Kernel Image
on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'Root Manager Variant'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - next
          - sukisu
      ksu_ref:
        description: 'Commit hash, tag, or branch (Default: 28db74f)'
        required: false
        default: '28db74f'
        type: string
env:
  CLANG_DIR: clang-r596125
  KSU_VARIANT: ${{ github.event.inputs.ksu_variant || 'official' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || '28db74f' }}
  KSU_MODE: builtin
  NOMOUNT_REF: v2.2.0
jobs:
  build-kernel-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
      - name: Increase file limit
        run: |
          sudo sysctl -w vm.swappiness=100
      - name: Check repository
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc device-tree-compiler bison flex libssl-dev build-essential libelf-dev u-boot-tools
          sudo curl --create-dirs -o /usr/local/bin/repo -L https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
      - name: Clone repo and sync
        run: |
          repo init -u https://github.com/tekocheng/aospa-calcite-kernel -b main -m manifest.xml --depth=1
          repo sync
          cp -rvf android_kernel_xiaomi_sm8450/. kernel_platform/xiaomi/sm8450/
          sed -i 's/\r$//' kernel_platform/xiaomi/sm8450/scripts/setlocalversion
          mkdir -p device/xiaomi/marble-kernel/dtbs
          echo "SRC_ROOT=$(pwd)" > kernel_platform/xiaomi/sm8450/.build.rc
      - name: Cache Clang
        uses: actions/cache@v6.1.0
        with:
          path: kernel_platform/clang
          key: clang-r596125
      - name: Setup Clang
        run: |
          mkdir -p kernel_platform/clang
          cd kernel_platform/clang
          if [ ! -d "${CLANG_DIR}" ]; then
            echo "Clang not found in cache. Downloading..."
            git clone -n --depth=1 --filter=tree:0 -b main-kernel --single-branch \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 .
            git sparse-checkout init --cone
            git sparse-checkout set ${CLANG_DIR}
            git checkout
          else
            echo "Using cached ${CLANG_DIR}"
          fi
      - name: Include KernelSU (${{ env.KSU_VARIANT }})
        run: |
          cd kernel_platform/xiaomi/sm8450
          rm -rf KernelSU
          if [ "${{ env.KSU_VARIANT }}" = "next" ]; then
            echo "Setting up KernelSU-Next (Ref: ${{ env.KSU_REF }})..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ env.KSU_REF }}"
          elif [ "${{ env.KSU_VARIANT }}" = "sukisu" ]; then
            echo "Setting up SukiSU-Ultra (Ref: ${{ env.KSU_REF }})..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ env.KSU_REF }}"
          else
            echo "Setting up Official KernelSU (Ref: ${{ env.KSU_REF }})..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ env.KSU_REF }}"
          fi
      - name: Include SUSFS
        run: |
          KDIR="$(pwd)/kernel_platform/xiaomi/sm8450"
          
          # 1. Universal kernel patch (Required for all variants)
          if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch" ]; then
            echo "Applying kernel SUSFS patch..."
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch "$KDIR/"
            cd "$KDIR"
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: Kernel patch had minor fuzz, continuing..."
          else
            echo "Error: Kernel SUSFS patch not found!"
            exit 1
          fi

          # 2. Manager-specific patch (Only for Official KSU to prevent patch failures on forks)
          if [ "${{ env.KSU_VARIANT }}" = "official" ]; then
            echo "Applying SUSFS patch to Official KernelSU source..."
            cd "$KDIR/KernelSU"
            if [ -f "../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch" ]; then
              cp ../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch .
              patch -p1 < 10_enable_susfs_for_ksu.patch
            else
              echo "Error: KSU SUSFS patch not found!"
              exit 1
            fi
          else
            echo "Skipping manager-specific SUSFS patch for ${{ env.KSU_VARIANT }} (handled natively)."
          fi
      - name: Include NoMount
        run: |
          cd kernel_platform/xiaomi/sm8450
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh" | bash -s "${NOMOUNT_REF}"
      - name: Build kernel image
        env:
          KSU_MODE: ${{ env.KSU_MODE }}
          KSU_VARIANT: ${{ env.KSU_VARIANT }}
          NOMOUNT_BUILTIN: "1"
        run: |
          cd kernel_platform/xiaomi/sm8450
          export PATH="$(realpath ../../clang/${CLANG_DIR}/bin):$PATH"
          ./build.sh marble --only-kernel
      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kernel-image-${{ env.KSU_VARIANT }}-susfs
          path: device/xiaomi/marble-kernel/Image
          compression-level: 9
